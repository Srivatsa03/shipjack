[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shipjack"
version = "0.1.0.dev0"
description = "A reference integration that makes a merchant agent-ready for AI checkout over ACP and AP2 (REST + MCP, Stripe test-mode settlement), with a safety suite."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Srivatsa Kamballa" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Office/Business :: Financial",
]
keywords = ["ap2", "acp", "agentic-commerce", "llm", "agents", "security", "sd-jwt", "payments"]
dependencies = [
  # Google's AP2 SDK is not on PyPI; pin the v0.2 commit this code was written against.
  "ap2 @ git+https://github.com/google-agentic-commerce/AP2.git@e1ea56db72a6385bce3e5c1112b3a56ce60acb43",
  "fastapi>=0.110",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "jsonschema>=4.20", "uvicorn>=0.30", "psycopg[binary]>=3.2",
       "shipjack[assistant]"]
serve = ["uvicorn>=0.30"]
stripe = ["stripe>=11"]
postgres = ["psycopg[binary]>=3.2"]
assistant = ["langgraph>=1.0", "langgraph-checkpoint-postgres>=2.0", "langchain-openai>=1.0",
             "langchain-google-genai>=4.0", "mcp>=1.20",
             "psycopg[binary,pool]>=3.2", "uvicorn>=0.30"]

[project.urls]
Homepage = "https://github.com/Srivatsa03/shipjack"
Repository = "https://github.com/Srivatsa03/shipjack"
"AP2 specification" = "https://github.com/google-agentic-commerce/AP2"
"ACP specification" = "https://github.com/agentic-commerce-protocol/agentic-commerce-protocol"

[project.scripts]
shipjack = "shipjack.cli:main"
shipjack-mcp = "shipjack.mcp:main"
shipjack-serve = "shipjack.http:main"
shipjack-receiver = "shipjack.webhooks:main"
shipjack-assistant = "shipjack.assistant.api:main"

[tool.setuptools]
packages = ["shipjack", "shipjack.assistant"]

[tool.setuptools.package-data]
shipjack = ["data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
