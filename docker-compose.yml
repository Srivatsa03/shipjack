# Local development stack. Every port binds to 127.0.0.1 only.
#   docker compose up -d db          # Postgres 17 with pgvector
services:
  db:
    image: pgvector/pgvector:pg17
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: shipjack
      POSTGRES_DB: shipjack
      # local development only; set SHIPJACK_PG_PASSWORD to change it
      POSTGRES_PASSWORD: ${SHIPJACK_PG_PASSWORD:-shipjack-dev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipjack -d shipjack"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
