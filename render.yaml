# Render blueprint: the store and the assistant, from one Docker image (Dockerfile); SHIPJACK_SERVICE
# picks which one /app/start.sh runs. (A start command with quotes in it reaches the container with
# the quotes still on, so the command is one plain path.)
# Create it in the Render dashboard: New > Blueprint > pick this repo. Render asks for the service
# values marked "sync: false"; SHIPJACK_DB in the shared group you add by hand afterwards
# (a blueprint doesn't create an empty group value). docs/DEPLOY.md has the steps.
envVarGroups:
  - name: shipjack-shared
    envVars:
      - key: SHIPJACK_DB              # the Neon connection string (the direct one, not "-pooler")
        sync: false
      - key: SHIPJACK_WEBHOOK_SECRET  # signs the store's order webhooks to the assistant
        generateValue: true
      - key: SHIPJACK_TOKEN           # the assistant's token at the store's ACP and MCP API
        generateValue: true
      - key: SHIPJACK_OPERATOR_TOKEN  # the store's operator token (refunds, shipping, imports)
        generateValue: true

services:
  - type: web
    name: shipjack-store
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/start.sh
    healthCheckPath: /.well-known/acp.json
    envVars:
      - fromGroup: shipjack-shared
      - key: SHIPJACK_SERVICE
        value: store
      - key: SHIPJACK_WEBHOOK_URL     # https://<the assistant's onrender.com address>/api/webhooks/orders
        sync: false
      - key: SHIPJACK_CATALOG
        value: sample
      - key: SHIPJACK_EMBEDDER
        value: model2vec:minishlab/potion-base-8M

  - type: web
    name: shipjack-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: /app/start.sh
    healthCheckPath: /api/health
    envVars:
      - fromGroup: shipjack-shared
      - key: SHIPJACK_SERVICE
        value: assistant
      - key: SHIPJACK_STORE_URL       # https://<the store's onrender.com address>
        sync: false
      - key: SHIPJACK_WEB_ORIGINS     # https://<your Vercel address>
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SHIPJACK_DEMO
        value: "1"
      - key: SHIPJACK_MODEL_PROVIDER
        value: groq
      - key: SHIPJACK_MODEL
        value: openai/gpt-oss-120b
      - key: SHIPJACK_FALLBACK_PROVIDER
        value: groq
      - key: SHIPJACK_FALLBACK_MODEL
        value: openai/gpt-oss-20b
      - key: SHIPJACK_DEMO_CALLS_PER_GUEST
        value: "40"
      - key: SHIPJACK_DEMO_CALLS_PER_DAY
        value: "600"
